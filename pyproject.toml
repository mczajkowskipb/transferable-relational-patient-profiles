[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transferable-relational-patient-profiles"
version = "0.1.0"
description = "Executable relational patient profiles and source-derived transportability certificates for frozen cross-cohort reuse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcin Czajkowski" }]
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
